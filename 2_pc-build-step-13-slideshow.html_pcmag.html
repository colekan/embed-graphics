<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC Build Story: Step 13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: 'Roboto', Arial, sans-serif; -webkit-font-smoothing: antialiased; }

  .slideshow {
    width: 768px;
    max-width: 100%;
    margin: 0 auto;
    background: transparent;
    border-radius: 8px;
    overflow: hidden;
    color: #fff;
  }

  /* Image area: fixed 16:9 */
  .media {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #121218;
    overflow: hidden;
  }
  .media img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity .25s ease;
  }
  .media img.loading { opacity: 0; }
  /* Fade the bottom of the photo into the caption panel */
  .media::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 18%;
    background: linear-gradient(to bottom, rgba(18,18,24,0) 0%, rgba(18,18,24,1) 100%);
    pointer-events: none;
  }

  /* Caption area: height follows the caption text */
  .text {
    background: #121218;
    padding: 4px 20px 24px;
  }
  .credit {
    font-size: 12px;
    line-height: 20px;
    font-weight: 400;
    color: rgba(255,255,255,.85);
    margin: 0 0 14px;
  }
  .credit:empty { display: none; }
  .caption {
    font-size: 16px;
    line-height: 1.5;
    font-weight: 400;
    margin: 0;
  }

  /* Nav bar */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    padding: 0 8px;
    background: #fff;
    color: #121218;
  }
  .counter {
    font-size: 16px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .arrow {
    width: 40px; height: 40px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 0; padding: 0;
    background: #121218;
    color: #fff;
    cursor: pointer;
    border-radius: 50%;
    transition: background .15s ease, transform .15s ease;
  }
  .arrow:hover { background: #3a3a44; transform: scale(1.06); }
  .arrow:focus-visible { outline: 2px solid #121218; outline-offset: 3px; }
  .arrow[disabled] { opacity: .25; cursor: default; transform: none; background: #121218; }
  .arrow svg { width: 22px; height: 22px; }
  /* Enlarge button */
  .media { cursor: zoom-in; }
  .zoom-btn {
    position: absolute; top: 12px; right: 12px; z-index: 2;
    width: 36px; height: 36px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    border: 0; padding: 0; cursor: pointer;
    background: rgba(18,18,24,.75); color: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
    transition: background .15s ease, transform .15s ease;
  }
  .zoom-btn:hover { background: rgba(18,18,24,.95); transform: scale(1.06); }
  .zoom-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .zoom-btn svg { width: 18px; height: 18px; }
  .zoom-btn .icon-collapse { display: none; }

  /* Enlarged: same design, filling the bigger iframe the host page provides */
  body.expanded .slideshow {
    width: 100%; max-width: none; height: 100vh;
    border-radius: 0;
    display: flex; flex-direction: column;
  }
  body.expanded .media { flex: 0 1 auto; min-height: 0; cursor: zoom-out; }
  body.expanded .media img { object-fit: contain; }
  body.expanded .text, body.expanded .nav { flex: 0 0 auto; }
  body.expanded .zoom-btn .icon-expand { display: none; }
  body.expanded .zoom-btn .icon-collapse { display: block; }
</style>
</head>
<body>

<div class="slideshow" id="slideshow" role="region" aria-roledescription="carousel" aria-label="PC Build Story: Step 13" tabindex="0">
  <div class="media" id="media">
    <img id="slideImg" alt="" src="">
    <button class="zoom-btn" id="zoomBtn" type="button" aria-label="Enlarge image">
      <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
      <svg class="icon-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="text" aria-live="polite">
    <p class="credit" id="slideCredit"></p>
    <p class="caption" id="slideCaption"></p>
  </div>
  <div class="nav">
    <button class="arrow" id="prevBtn" type="button" aria-label="Previous slide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12H3M10 5l-7 7 7 7"/></svg>
    </button>
    <span class="counter" id="slideCounter">1/40</span>
    <button class="arrow" id="nextBtn" type="button" aria-label="Next slide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M14 5l7 7-7 7"/></svg>
    </button>
  </div>
</div>

<script>
(function () {
  var IMG = "https://images.jifo.co/39204245_";
  var CREDIT = "(Credit: Joseph Maldonado/PCMag)";

  // [image id, caption] — images hosted on Infogram (images.jifo.co)
  var slides = [
    ["1795627757962.jpg", "First screen up is for language settings. I chose my language and preferred time/currency format."],
    ["1795627784036.jpg", "That was followed by the keyboard layout settings screen, for which I chose US."],
    ["1795627784036.jpg", "And on this screen, I chose Install Windows 11. (Down the road, you can use your Windows installer key to help resolve intractable bootup problems by using the Repair My PC option here.)"],
    ["1795627841951.jpg", "On the next screen, you will enter your Windows 11 product key, if you have purchased one. If you want to install Windows 11 now but enter a product key later, you can choose “I don't have a product key” to proceed. That’s what I’ll do here."],
    ["1795627873940.jpg", "You should then see this “We're getting a few things ready” screen…"],
    ["1795627902276.jpg", "…and soon after, a screen called Select Image lets you choose the version of Windows 11 you wish to install. I chose Windows 11 Pro, and then hit Next."],
    ["1795627945313.jpg", "Next, you'll be asked to review the Windows EULA; scroll your way to the bottom of the text and hit Accept when ready."],
    ["1795627969574.jpg", "After a “Please Wait” progress screen, Windows should take you to this screen, which enumerates the bootable disks that can accept your Windows install. Depending on the drives you have installed, you'll get a screen that looks something like the above."],
    ["1795628021082.jpg", "Three of the drives are being detected as Unallocated Space, since they are new and unformatted. The Toshiba 4TB hard drive is showing up as Disk 0 (with Unallocated Space housing most of the capacity, 3.6TB). The first of the M.2 SSDs, showing up as 1.8TB of Unallocated Space, is our WD Black SSD (the one I plan to use as the boot drive), is Disk 1. So I’ll choose the Disk 1 block of Unallocated Space as my install destination, as shown above, and hit Next."],
    ["1795628073335.jpg", "The next screen is confirmation of this action, on which you’ll hit Install."],
    ["1795628090990.jpg", "Confirming that, you’re bounced to the first of several blue progress screens you’ll see. Now’s a good time for a coffee break and a stretch."],
    ["1795628132525.jpg", "You will see some restarts along the way; let Windows do its thing."],
    ["1795628156549.jpg", "Here’s how you know you’re getting close."],
    ["1795628213796.jpg", "Eventually, you will be dropped to a series of screens to choose country or region and a host of other localized preferences. Here, I chose “United States.”"],
    ["1795628227319.jpg", "Next up is your preferred national keyboard layout (for me, also US)..."],
    ["1795628287834.jpg", "…and whether to opt for a second keyboard layout. (I chose Skip for that.)"],
    ["1795628351910.jpg", "Next up: Attaching to a wired or wireless network. This particular motherboard has Wi-Fi onboard, and you will want to install the wireless driver from a file you grab from Asus' website from another PC. You’ll need a second USB flash drive for that. I went to Asus’ site, browsed to the page for the ProArt X870E board I have, and downloaded the Wi-Fi driver file from the support and downloads page. You may need to unzip the file on the USB drive if it comes zipped."],
    ["1795628351910.jpg", "If you have access to Ethernet, you can plug in your PC via one of the RJ-45 jacks on the back, but you may need to install the Ethernet LAN driver in the same way to get that LAN port working. (It really depends on the board. Sometimes Windows 11 will autoinstall it.) Once you have the appropriate driver from your motherboard maker’s website on your flash drive, insert it in another port and navigate to it via the “Install driver” menu here."],
    ["1795628467887.jpg", "With the driver now installed, you now get access to the list of locally available Wi-Fi networks. (Quite a few, in our offices!) I chose one and entered the password to get online."],
    ["1795628506775.jpg", "Once you connect to the internet here, you’ll face a (perhaps lengthy) wait for updates. This could be another good break time."],
    ["1795628536675.jpg", "You’ll soon hit this screen, which will ask you to name your PC. Pick something unique. Hopefully you were considering this during your build by browsing baby-name books and a copy of What to Expect When You’re Expecting a PC."],
    ["1795628569100.jpg", "On the next screen, select between these two choices, as appropriate, for the kind of PC you are configuring: a model for an office or school, or one for personal/home use. I chose the top option."],
    ["1795628591058.jpg", "Now this next screen generally does require a good long wait. Even with a fresh version of the Windows 11 installer on my USB key, I had to hang around for 15 minutes or so for the latest software bits to download."],
    ["1795628618276.jpg", "Once that big update sequence is done, you will get this prompt page justifying why you’ll need to log into a Microsoft account before going further. Of late, Microsoft has closed up loopholes that let you get around this requirement. Hit Sign In."],
    ["1795628642658.jpg", "It’s up to you how to proceed on this page. If you use an existing Microsoft account, you may be asked to verify your identity or two-factor authenticate into proceeding. (If you don’t have one, you’ll have to create one on the spot.)"],
    ["1795628672983.jpg", "I added our lab’s general Microsoft account that we use for a variety of purposes, and chose to sign in via password. hitting the link for “Use your password instead.”"],
    ["1795628707188.jpg", "Here goes the password page. Enter and click Sign In."],
    ["1795628782309.jpg", "OK, after bypassing the login bridge trolls, you’ll be prompted to set up a PIN to log in to your PC. It can be just numbers, or if you hit the checkbox, you can incorporate letters or symbols."],
    ["1795628807173.jpg", "That's followed by Windows 11’s privacy settings setup. The toggles all default to Yes; I generally slide them all to No, but do as you see fit. (Depending on your screen resolution, you may need to scroll down to see more privacy choices below the initial screen. Half are hidden here.)"],
    ["1795628855536.jpg", "On the next screen, I hit Continue…"],
    ["1795628894010.jpg", "…and in our case, because our Microsoft account was not new (indeed, it was our lab testing Windows account that I used!), we were asked whether we wanted to restore settings from one of the many PCs previously associated with it. If you’re carrying over a Microsoft account from another relevant PC that this one will be replacing, you may want to do this. Otherwise, instead, do as I did and select “Set up as a new PC,” near the bottom of the screen."],
    ["1795628931479.jpg", "You’ll have to bypass this “Are you sure?” screen that will follow. Again choose “Set up as a new PC.”"],
    ["1795628961272.jpg", "Following that is a screen that will prompt you to profile how you’ll use your new PC, which Microsoft says will customize the ads, tips, and other related experiences you see. It’s perfectly fine to bypass this (hit “Skip”), but here I’ve chosen some selections for an average home gaming and family PC. Hit Accept when satisfied with your choices, if any."],
    ["1795628997360.jpg", "Next up is the option to have your Android phone linked to your Microsoft account. Again: This is your call, no pun intended, but you can reply to texts, initiate voice calls, and more from your PC if you enable this. Follow the QR code if desired, or follow the instructions for iPhone if you have one of those. I’ll be skipping this."],
    ["1795629026006.jpg", "Even if you don’t opt for the phone linking, you can scan the QR code on the next screen to have your phone’s camera roll back up to Microsoft OneDrive. I bypassed that for the purposes of this build, but you do you."],
    ["1795629053149.jpg", "Next up here is a permissions screen to allow (or not) your browser settings and history to be drawn into Microsoft Edge, if that’s not already your browser of choice. I chose Not Now."],
    ["1795629076199.jpg", "Now, expect nags to sign up for (or decline) a handful of further Microsoft services as you move forward. Here we’re getting offered a Microsoft 365 Personal trial, which includes cloud backups and access to the online versions of Office suite programs…"],
    ["1795629460314.jpg", "…followed by a separate offer for cloud storage via Microsoft 365 Basic…"],
    ["1795629492405.jpg", "…and then, an offer for PC Game Pass."],
    ["1795629535754.jpg", "At last, the end of the install road! I chose “Go to desktop” to get started in the Windows environment proper."]
  ];

  var root = document.getElementById('slideshow');
  var img = document.getElementById('slideImg');
  var credit = document.getElementById('slideCredit');
  var caption = document.getElementById('slideCaption');
  var counter = document.getElementById('slideCounter');
  var prev = document.getElementById('prevBtn');
  var next = document.getElementById('nextBtn');
  var i = 0;
  var cache = {};

  function preload(n) {
    if (n < 0 || n >= slides.length) return;
    var src = IMG + slides[n][0];
    if (!cache[src]) { cache[src] = new Image(); cache[src].src = src; }
  }

  // Tell the parent page the new height so the iframe can grow/shrink with the caption.
  // When enlarged, keep the caption area at the height of the longest caption
  // so the enlarged view stays the same size and doesn't jump between slides.
  var lockedFor = -1;
  function lockCaptionHeight() {
    var t = document.querySelector('.text');
    if (!document.body.classList.contains('expanded')) {
      t.style.minHeight = ''; lockedFor = -1; return;
    }
    var w = t.clientWidth;
    if (w === lockedFor) return;
    var probe = t.cloneNode(true);
    probe.removeAttribute('aria-live');
    probe.style.cssText = 'position:absolute;visibility:hidden;left:-9999px;top:0;min-height:0;width:' + w + 'px';
    document.body.appendChild(probe);
    var cap = probe.querySelector('.caption'), max = 0;
    for (var n = 0; n < slides.length; n++) {
      cap.textContent = slides[n][1];
      max = Math.max(max, probe.offsetHeight);
    }
    probe.remove();
    t.style.minHeight = max + 'px';
    lockedFor = w;
  }

  function postHeight() {
    lockCaptionHeight();
    var m = document.getElementById('media');
    var h = Math.ceil(m.offsetWidth * 9 / 16 +
      document.querySelector('.text').offsetHeight +
      document.querySelector('.nav').offsetHeight);
    try {
      window.parent.postMessage({ type: 'embed-size', height: h }, '*');
      window.parent.postMessage({ 'frameHeight': h }, '*');
      window.parent.postMessage(JSON.stringify({ src: window.location.toString(), context: 'iframe.resize', height: h }), '*');
    } catch (e) {}
  }

  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    var src = IMG + slides[i][0];
    if (img.getAttribute('src') !== src) {
      img.classList.add('loading');
      img.onload = function () { img.classList.remove('loading'); };
      img.src = src;
    }
    img.alt = 'Slide ' + (i + 1) + ' of ' + slides.length;
    credit.textContent = slides[i][2] === undefined ? CREDIT : slides[i][2];
    caption.textContent = slides[i][1];
    counter.textContent = (i + 1) + '/' + slides.length;
    prev.disabled = i === 0;
    next.disabled = i === slides.length - 1;
    preload(i + 1); preload(i - 1);
    postHeight();
  }

  // ---- Click to enlarge ----
  // Asks the host page to enlarge the iframe (needs the embed script on the page).
  // If the page doesn't answer, opens the full-size photo in a new tab instead.
  var expanded = false, ackTimer = null;
  var zoomBtn = document.getElementById('zoomBtn');

  function toHost(msg) { try { window.parent.postMessage(msg, '*'); } catch (e) {} }

  function requestExpand() {
    if (window.parent === window) { window.open(IMG + slides[i][0], '_blank', 'noopener'); return; }
    toHost({ type: 'embed-expand' });
    clearTimeout(ackTimer);
    ackTimer = setTimeout(function () { window.open(IMG + slides[i][0], '_blank', 'noopener'); }, 600);
  }
  function requestCollapse() { toHost({ type: 'embed-collapse' }); }

  function setExpanded(on) {
    clearTimeout(ackTimer);
    expanded = on;
    document.body.classList.toggle('expanded', on);
    zoomBtn.setAttribute('aria-label', on ? 'Close enlarged view' : 'Enlarge image');
    postHeight();
  }

  window.addEventListener('message', function (e) {
    if (e.source !== window.parent || !e.data || e.data.type !== 'embed-expanded') return;
    setExpanded(!!e.data.expanded);
  });

  document.getElementById('media').addEventListener('click', function () {
    expanded ? requestCollapse() : requestExpand();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && expanded) { requestCollapse(); e.preventDefault(); }
  });

  prev.addEventListener('click', function () { show(i - 1); });
  next.addEventListener('click', function () { show(i + 1); });

  // Arrow keys (anywhere in the frame, so they also work when enlarged)
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { show(i - 1); e.preventDefault(); }
    if (e.key === 'ArrowRight') { show(i + 1); e.preventDefault(); }
  });

  // Swipe on touch devices
  var x0 = null;
  root.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  root.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) show(dx < 0 ? i + 1 : i - 1);
    x0 = null;
  });

  if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
  window.addEventListener('load', postHeight);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(postHeight);

  show(0);
})();
</script>
</body>
</html>
