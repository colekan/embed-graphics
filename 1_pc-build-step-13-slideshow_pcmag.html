<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC Build Story: Step 13 (BIOS)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: 'Roboto', Arial, sans-serif; -webkit-font-smoothing: antialiased; }

  .slideshow {
    width: 768px;
    max-width: 100%;
    margin: 0 auto;
    background: transparent;
    border-radius: 8px;
    overflow: hidden;
    color: #fff;
  }

  /* Image area: fixed 16:9 */
  .media {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #121218;
    overflow: hidden;
  }
  .media img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity .25s ease;
  }
  .media img.loading { opacity: 0; }
  /* Fade the bottom of the photo into the caption panel */
  .media::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 18%;
    background: linear-gradient(to bottom, rgba(18,18,24,0) 0%, rgba(18,18,24,1) 100%);
    pointer-events: none;
  }

  /* Caption area: height follows the caption text */
  .text {
    background: #121218;
    padding: 4px 20px 24px;
  }
  .credit {
    font-size: 12px;
    line-height: 20px;
    font-weight: 400;
    color: rgba(255,255,255,.85);
    margin: 0 0 14px;
  }
  .credit:empty { display: none; }
  .caption {
    font-size: 16px;
    line-height: 1.5;
    font-weight: 400;
    margin: 0;
  }

  /* Nav bar */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    padding: 0 8px;
    background: #fff;
    color: #121218;
  }
  .counter {
    font-size: 16px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .arrow {
    width: 40px; height: 40px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 0; padding: 0;
    background: #121218;
    color: #fff;
    cursor: pointer;
    border-radius: 50%;
    transition: background .15s ease, transform .15s ease;
  }
  .arrow:hover { background: #3a3a44; transform: scale(1.06); }
  .arrow:focus-visible { outline: 2px solid #121218; outline-offset: 3px; }
  .arrow[disabled] { opacity: .25; cursor: default; transform: none; background: #121218; }
  .arrow svg { width: 22px; height: 22px; }
  /* Enlarge button */
  .media { cursor: zoom-in; }
  .zoom-btn {
    position: absolute; top: 12px; right: 12px; z-index: 2;
    width: 36px; height: 36px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    border: 0; padding: 0; cursor: pointer;
    background: rgba(18,18,24,.75); color: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
    transition: background .15s ease, transform .15s ease;
  }
  .zoom-btn:hover { background: rgba(18,18,24,.95); transform: scale(1.06); }
  .zoom-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .zoom-btn svg { width: 18px; height: 18px; }
  .zoom-btn .icon-collapse { display: none; }

  /* Enlarged: same design, filling the bigger iframe the host page provides */
  body.expanded .slideshow {
    width: 100%; max-width: none; height: 100vh;
    border-radius: 0;
    display: flex; flex-direction: column;
  }
  body.expanded .media { flex: 0 1 auto; min-height: 0; cursor: zoom-out; }
  body.expanded .media img { object-fit: contain; }
  body.expanded .text, body.expanded .nav { flex: 0 0 auto; }
  body.expanded .zoom-btn .icon-expand { display: none; }
  body.expanded .zoom-btn .icon-collapse { display: block; }
</style>
</head>
<body>

<div class="slideshow" id="slideshow" role="region" aria-roledescription="carousel" aria-label="PC Build Story: Step 13 (BIOS)" tabindex="0">
  <div class="media" id="media">
    <img id="slideImg" alt="" src="">
    <button class="zoom-btn" id="zoomBtn" type="button" aria-label="Enlarge image">
      <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
      <svg class="icon-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="text" aria-live="polite">
    <p class="credit" id="slideCredit"></p>
    <p class="caption" id="slideCaption"></p>
  </div>
  <div class="nav">
    <button class="arrow" id="prevBtn" type="button" aria-label="Previous slide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12H3M10 5l-7 7 7 7"/></svg>
    </button>
    <span class="counter" id="slideCounter">1/7</span>
    <button class="arrow" id="nextBtn" type="button" aria-label="Next slide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M14 5l7 7-7 7"/></svg>
    </button>
  </div>
</div>

<script>
(function () {
  var IMG = "https://images.jifo.co/39204245_";
  var CREDIT = "(Credit: Joseph Maldonado/PCMag)";

  // [image id, caption] — images hosted on Infogram (images.jifo.co)
  var slides = [
    ["1795540182635.jpg", "First off, here’s a look at the overall BIOS screen in the default EZ Mode. (You can access Advanced Mode via a key tap to get to more detailed settings.) I am seeing the CPU and motherboard detected correctly (upper-left), as well as the memory amount (32GB). So far, so good."],
    ["1795540724254.jpg", "Things are also looking good with the CPU temperature (not that far above room temperature), indicating that our CPU’s liquid cooling system is doing its job. And all is well in the storage information section below it. There, I can see the two M.2 SSDs and the 4TB Toshiba hard drive all being detected."],
    ["1795541284496.jpg", "Our fans are also being detected. The ones that say “N/A” correspond to chassis fan (CHA_FAN) headers that are not being used. It's especially important if you see a high CPU temperature, and a lack of activity on the CPU fan or AIO pump headers (depending on which you’re using), to shut down right away and determine why they are not running. (Check the wiring first.)"],
    ["1795541268453.jpg", "So far, all looks good. One performance tweak to make in the BIOS is to adjust the memory kit settings. As you can see here, the memory is detected in the appropriate DIMM slots as separate 16GB modules, but it is running at the default 4,800MHz speed."],
    ["1795541226542.jpg", "You'll want to enable the AMD EXPO profile for this memory kit. Within this particular Asus BIOS, the company refers to that as DOCP, which stands for Direct Over Clock Profile. (DOCP is Asus’ house lingo when it applies AMD EXPO or its Intel memory-speedup equivalent, XMP. Other boards will more than likely call it EXPO or XMP in their BIOSes.) I clicked the Enabled option here and selected the single available profile. This will allow the memory modules to run at 6,400MHz (which will be indicated by “DDR5 6400MHz” in place of “4800MHz”). You'll need to reboot for this to take effect."],
    ["1795541349419.jpg", "One other performance check: Resizable BAR. This feature (BAR stands for “Base Address Register”) emerged over the last five or six years; it enables your CPU to access the full pool of your Nvidia graphics card’s VRAM at once. (Sometimes it’s called ResizeBAR or ReBAR, or in cases where you have an AMD Radeon card installed, SAM, for Smart Access Memory.) With a gaming or content-creation PC packing a powerful graphics card/CPU combo like this, you want to have it on. It requires support by the motherboard BIOS, the GPU, and the CPU; if they all comply, the BIOS should show it enabled by default, but not always. You'll want to check. It was indeed turned “on” here…all good."],
    ["1795541400800.jpg", "To exit the BIOS and save my settings, I hit F10 and OK to accept the changes I made. (The list you see here all relate to the updated memory setting.) That would set the PC to reboot."]
  ];

  var root = document.getElementById('slideshow');
  var img = document.getElementById('slideImg');
  var credit = document.getElementById('slideCredit');
  var caption = document.getElementById('slideCaption');
  var counter = document.getElementById('slideCounter');
  var prev = document.getElementById('prevBtn');
  var next = document.getElementById('nextBtn');
  var i = 0;
  var cache = {};

  function preload(n) {
    if (n < 0 || n >= slides.length) return;
    var src = IMG + slides[n][0];
    if (!cache[src]) { cache[src] = new Image(); cache[src].src = src; }
  }

  // Tell the parent page the new height so the iframe can grow/shrink with the caption.
  // When enlarged, keep the caption area at the height of the longest caption
  // so the enlarged view stays the same size and doesn't jump between slides.
  var lockedFor = -1;
  function lockCaptionHeight() {
    var t = document.querySelector('.text');
    if (!document.body.classList.contains('expanded')) {
      t.style.minHeight = ''; lockedFor = -1; return;
    }
    var w = t.clientWidth;
    if (w === lockedFor) return;
    var probe = t.cloneNode(true);
    probe.removeAttribute('aria-live');
    probe.style.cssText = 'position:absolute;visibility:hidden;left:-9999px;top:0;min-height:0;width:' + w + 'px';
    document.body.appendChild(probe);
    var cap = probe.querySelector('.caption'), max = 0;
    for (var n = 0; n < slides.length; n++) {
      cap.textContent = slides[n][1];
      max = Math.max(max, probe.offsetHeight);
    }
    probe.remove();
    t.style.minHeight = max + 'px';
    lockedFor = w;
  }

  function postHeight() {
    lockCaptionHeight();
    var m = document.getElementById('media');
    var h = Math.ceil(m.offsetWidth * 9 / 16 +
      document.querySelector('.text').offsetHeight +
      document.querySelector('.nav').offsetHeight);
    try {
      window.parent.postMessage({ type: 'embed-size', height: h }, '*');
      window.parent.postMessage({ 'frameHeight': h }, '*');
      window.parent.postMessage(JSON.stringify({ src: window.location.toString(), context: 'iframe.resize', height: h }), '*');
    } catch (e) {}
  }

  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    var src = IMG + slides[i][0];
    if (img.getAttribute('src') !== src) {
      img.classList.add('loading');
      img.onload = function () { img.classList.remove('loading'); };
      img.src = src;
    }
    img.alt = 'Slide ' + (i + 1) + ' of ' + slides.length;
    credit.textContent = slides[i][2] === undefined ? CREDIT : slides[i][2];
    caption.textContent = slides[i][1];
    counter.textContent = (i + 1) + '/' + slides.length;
    prev.disabled = i === 0;
    next.disabled = i === slides.length - 1;
    preload(i + 1); preload(i - 1);
    postHeight();
  }

  // ---- Click to enlarge ----
  // Asks the host page to enlarge the iframe (needs the embed script on the page).
  // If the page doesn't answer, opens the full-size photo in a new tab instead.
  var expanded = false, ackTimer = null;
  var zoomBtn = document.getElementById('zoomBtn');

  function toHost(msg) { try { window.parent.postMessage(msg, '*'); } catch (e) {} }

  function requestExpand() {
    if (window.parent === window) { window.open(IMG + slides[i][0], '_blank', 'noopener'); return; }
    toHost({ type: 'embed-expand' });
    clearTimeout(ackTimer);
    ackTimer = setTimeout(function () { window.open(IMG + slides[i][0], '_blank', 'noopener'); }, 600);
  }
  function requestCollapse() { toHost({ type: 'embed-collapse' }); }

  function setExpanded(on) {
    clearTimeout(ackTimer);
    expanded = on;
    document.body.classList.toggle('expanded', on);
    zoomBtn.setAttribute('aria-label', on ? 'Close enlarged view' : 'Enlarge image');
    postHeight();
  }

  window.addEventListener('message', function (e) {
    if (e.source !== window.parent || !e.data || e.data.type !== 'embed-expanded') return;
    setExpanded(!!e.data.expanded);
  });

  document.getElementById('media').addEventListener('click', function () {
    expanded ? requestCollapse() : requestExpand();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && expanded) { requestCollapse(); e.preventDefault(); }
  });

  prev.addEventListener('click', function () { show(i - 1); });
  next.addEventListener('click', function () { show(i + 1); });

  // Arrow keys (anywhere in the frame, so they also work when enlarged)
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { show(i - 1); e.preventDefault(); }
    if (e.key === 'ArrowRight') { show(i + 1); e.preventDefault(); }
  });

  // Swipe on touch devices
  var x0 = null;
  root.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  root.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) show(dx < 0 ? i + 1 : i - 1);
    x0 = null;
  });

  if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
  window.addEventListener('load', postHeight);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(postHeight);

  show(0);
})();
</script>
</body>
</html>
