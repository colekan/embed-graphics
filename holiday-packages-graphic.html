<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holiday Shopping Packages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #121117;
    --paper: #ffffff;
    --muted: #5b5966;
    --grid: #d9d8de;
    --bar-top: #dfffd0;
    --bar-mid: #f0a07e;
    --bar-bot: #ff5a50;
    --up: #1f8a4c;
    --down: #d63a31;
    --h: clamp(280px, 52vw, 460px);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Space Grotesk", system-ui, sans-serif;
  }
  .graphic {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 16px 28px;
  }

  /* Title banners */
  .kicker, .title {
    display: inline-block;
    background: var(--ink);
    color: #fff;
    font-weight: 700;
    line-height: 1;
  }
  .kicker {
    font-size: clamp(14px, 2.4vw, 24px);
    padding: 8px 18px;
    transform: rotate(-1.2deg);
    clip-path: polygon(0 12%, 100% 0, 98% 100%, 1% 92%);
  }
  .title {
    display: block;
    width: fit-content;
    max-width: 100%;
    margin-top: 6px;
    font-size: clamp(26px, 6vw, 58px);
    padding: 14px 26px 18px;
    letter-spacing: -0.01em;
    transform: rotate(-1deg);
    clip-path: polygon(0 4%, 100% 0, 99% 96%, 1% 100%);
  }

  /* Chart */
  .chart {
    position: relative;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(8px, 3vw, 44px);
    margin-top: clamp(20px, 4vw, 40px);
  }
  .avg {
    position: absolute;
    left: 0; right: 0;
    top: calc(var(--h) - var(--h) * var(--avg-frac));
    border-top: 2px dashed var(--grid);
    pointer-events: none;
    z-index: 0;
    opacity: 0;
    transition: opacity .6s ease 1.1s, border-color .25s;
  }
  .chart.in .avg { opacity: 1; }
  .avg span {
    position: absolute;
    left: 0;
    top: 0;
    transform: translateY(-50%);
    background: var(--ink);
    color: #fff;
    font-weight: 700;
    font-size: clamp(10px, 1.7vw, 17px);
    padding: 5px 8px;
    white-space: nowrap;
  }
  .chart.focused .avg { border-color: #8f8d99; }

  .col {
    all: unset;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: opacity .25s ease, transform .25s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .col:focus-visible { outline: 3px solid #3d6cf0; outline-offset: 6px; border-radius: 4px; }
  .chart.focused .col:not(.active) { opacity: .35; }
  .col.active { transform: translateY(-4px); }

  .plot {
    height: var(--h);
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
  }
  .value {
    font-weight: 500;
    font-size: clamp(17px, 3.4vw, 34px);
    letter-spacing: -0.01em;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    background: var(--paper);
    padding: 0 4px;
    opacity: 0;
    transition: opacity .4s ease;
  }
  .chart.in .value { opacity: 1; }
  .value sup { font-size: .5em; vertical-align: .9em; margin-right: 1px; }
  .stem {
    width: 2px;
    height: clamp(26px, 5vw, 52px);
    background: var(--ink);
    margin-left: 10%;
  }
  .bar {
    width: 50%;
    height: 0;
    margin-bottom: calc(clamp(18px, 3vw, 34px) * -1);
    background: linear-gradient(to bottom, var(--bar-top) 0%, var(--bar-mid) 45%, var(--bar-bot) 82%);
    clip-path: polygon(0 clamp(10px, 2vw, 18px), 100% 0, 100% 100%, 0 100%);
    transition: height 1.1s cubic-bezier(.2,.8,.2,1), filter .25s;
  }
  .chart.in .bar { height: calc(var(--h) * var(--frac)); }
  .col.active .bar { filter: saturate(1.25) brightness(1.03); }

  .box { width: 76%; display: block; position: relative; }
  .tag {
    margin-top: clamp(10px, 2vw, 22px);
    background: var(--ink);
    color: #fff;
    font-weight: 700;
    font-size: clamp(11px, 2.4vw, 24px);
    padding: 6px clamp(6px, 1.4vw, 16px);
    white-space: nowrap;
  }


  @media (prefers-reduced-motion: reduce) {
    .bar, .avg, .value, .col { transition: none !important; }
  }
</style>
</head>
<body>
<figure class="graphic" aria-label="Average estimated value of holiday shopping packages by generation">
  <div class="kicker">Average Estimated Value of</div>
  <div class="title">Holiday Shopping Packages</div>

  <div class="chart" id="chart">
    <div class="avg" id="avg"><span id="avgLabel">All US Adults: $276.24</span></div>
  </div>

</figure>

<template id="boxTpl">
  <svg class="box" viewBox="0 0 170 150" aria-hidden="true">
    <!-- top -->
    <polygon points="0,38 85,0 170,38 85,76" fill="#8f8ba8"/>
    <!-- left / front -->
    <polygon points="0,38 85,76 85,150 0,112" fill="#2b2934"/>
    <!-- right -->
    <polygon points="85,76 170,38 170,112 85,150" fill="#5a5872"/>
    <!-- tape across top -->
    <polygon points="30,25 48,17 133,55 115,63" fill="#121117"/>
    <!-- tape down the right face -->
    <polygon points="115,63 133,55 133,80 115,88" fill="#121117"/>
  </svg>
</template>

<script>
  const AVG = 276.24;
  const MAX = 420; // scale ceiling, leaves headroom for labels
  const data = [
    { name: "Gen Z", value: 200.23 },
    { name: "Millennials", value: 227.25 },
    { name: "Gen X", value: 319.48 },
    { name: "Boomers", value: 347.84 },
  ];

  const chart = document.getElementById("chart");
  const boxTpl = document.getElementById("boxTpl");
  chart.style.setProperty("--avg-frac", AVG / MAX);

  const fmt = n => n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const cols = data.map(d => {
    const col = document.createElement("button");
    col.className = "col";
    col.type = "button";
    col.style.setProperty("--frac", d.value / MAX);
    col.setAttribute("aria-label", `${d.name}: $${fmt(d.value)}`);
    col.innerHTML = `
      <div class="plot">
        <div class="value"><sup>$</sup><span class="num">0.00</span></div>
        <div class="stem"></div>
        <div class="bar"></div>
      </div>`;
    col.appendChild(boxTpl.content.cloneNode(true));
    const tag = document.createElement("div");
    tag.className = "tag";
    tag.textContent = d.name;
    col.appendChild(tag);

    const activate = () => {
      cols.forEach(c => c.el.classList.toggle("active", c.el === col));
      chart.classList.add("focused");
    };
    const reset = () => {
      col.classList.remove("active");
      chart.classList.remove("focused");
    };
    col.addEventListener("mouseenter", activate);
    col.addEventListener("focus", activate);
    col.addEventListener("mouseleave", reset);
    col.addEventListener("blur", reset);
    col.addEventListener("click", e => {
      // tap toggle on touch devices
      if (col.classList.contains("active") && e.pointerType === "touch") { col.blur(); reset(); }
      else activate();
    });

    chart.appendChild(col);
    return { el: col, d, num: col.querySelector(".num") };
  });

  // Count-up numbers alongside bar growth
  const countUp = () => {
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const dur = reduce ? 0 : 1100;
    const start = performance.now();
    const ease = t => 1 - Math.pow(1 - t, 3);
    const tick = now => {
      const t = dur ? Math.min(1, (now - start) / dur) : 1;
      cols.forEach(c => c.num.textContent = fmt(c.d.value * ease(t)));
      if (t < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };

  const reveal = () => {
    if (chart.classList.contains("in")) return;
    chart.classList.add("in");
    countUp();
  };
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver(entries => {
      if (entries.some(e => e.isIntersecting)) { reveal(); io.disconnect(); }
    }, { threshold: 0.3 });
    io.observe(chart);
  } else {
    reveal();
  }
</script>
</body>
</html>
